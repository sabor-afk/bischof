# netlify.toml - BISCHOF DISTRIBUIDORA
# Configuração completa para deploy no Netlify
# Coloque este arquivo na raiz do repositório

# ==========================================
# CONFIGURAÇÃO DE BUILD
# ==========================================
[build]
  publish = "."
  # Se usar um build process (npm build, etc), defina aqui:
  # command = "npm run build"
  
  # Arquivos que trigam rebuild
  ignore = "git log -1 --pretty=%B"

# ==========================================
# CONTEXT: Produção (Default)
# ==========================================
[context.production]
  command = "echo 'Production build'"
  
  # Headers em produção
  [[context.production.headers]]
    for = "/*"
    [context.production.headers.values]
      X-Frame-Options = "SAMEORIGIN"
      X-Content-Type-Options = "nosniff"
      X-XSS-Protection = "1; mode=block"
      Referrer-Policy = "strict-origin-when-cross-origin"
      Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
      Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
      Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://formspree.io; frame-src 'self'; base-uri 'self'; form-action 'self' https://formspree.io"

# ==========================================
# CONTEXT: Deploy Preview
# ==========================================
[context.deploy-preview]
  command = "echo 'Deploy preview'"

# ==========================================
# CONTEXT: Branch Deploy
# ==========================================
[context.branch-deploy]
  command = "echo 'Branch deploy'"

# ==========================================
# HEADERS - SEGURANÇA GLOBAL
# ==========================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://formspree.io; frame-src 'self'; base-uri 'self'; form-action 'self' https://formspree.io"
    Vary = "Accept-Encoding"

# ==========================================
# HEADERS - IMAGENS (Cache 1 ano)
# ==========================================
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pdf/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

# ==========================================
# HEADERS - CSS (Cache 1 mês)
# ==========================================
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"
    Content-Type = "text/css"

# ==========================================
# HEADERS - JavaScript (Cache 1 mês)
# ==========================================
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"
    Content-Type = "application/javascript"

# ==========================================
# HEADERS - Fonts (Cache 1 ano)
# ==========================================
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# ==========================================
# HEADERS - HTML (Cache 2 dias)
# ==========================================
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=172800, must-revalidate"
    Content-Type = "text/html"

# ==========================================
# HEADERS - Manifest e Favicon
# ==========================================
[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ==========================================
# REDIRECTS - HTTP para HTTPS (Automático)
# ==========================================
# Netlify faz isso automaticamente

# ==========================================
# REDIRECTS - Customizados (Se precisar)
# ==========================================
# [[redirects]]
#   from = "/pagina-antiga"
#   to = "/pagina-nova"
#   status = 301
#   force = true

[[redirects]]
  from = "/formulario"
  to = "/formulario-bischof-custom.html"
  status = 200

[[redirects]]
  from = "/catalogo"
  to = "/catalogo-interativo.html"
  status = 200

# ==========================================
# REDIRECTS - Bloqueio de bots maliciosos
# ==========================================
# Netlify lida com bots através de _headers ou netlify.toml
# Configure no painel do Netlify: Site Settings → Build & Deploy → Post processing

