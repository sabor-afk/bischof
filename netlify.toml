# [analytics]
#   enabled = true

# ==========================================
# OBSERVAÇÕES IMPORTANTES
# ==========================================
# 1. Este arquivo é lido automaticamente pelo Netlify
# 2. Não precisa fazer upload manual
# 3. Mude de GitHub Pages para Netlify:
#    - Conecte seu repositório no Netlify
#    - Coloque este arquivo na raiz
#    - Faça commit e push
#    - Netlify fará deploy automático
# 4. Cada commit faz deploy automático (se configurado)
# 5. Preview URLs geradas para cada PR
